<svg xmlns="http://www.w3.org/2000/svg" width="460" height="210" viewBox="0 0 460 210">
  
  <style>
    .titulo { font: 700 19px 'Segoe UI', Ubuntu, sans-serif; fill: #c77dff; }
    .label  { font: 400 14px 'Segoe UI', Ubuntu, sans-serif; fill: #e0d4ff; }
    .valor  { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #ffffff; }
    .grande { font: 800 26px 'Segoe UI', Ubuntu, sans-serif; fill: #ffffff; }
    .peq    { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #a38fc7; }
    .linha  { opacity: 0; animation: entra .5s ease forwards; }
    @keyframes entra { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .anel   { stroke-dasharray: 251; stroke-dashoffset: 251; animation: anel 1.4s ease .3s forwards; }
    @keyframes anel { to { stroke-dashoffset: 0; } }
  </style>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0033"/>
      <stop offset="1" stop-color="#0d0117"/>
    </linearGradient>
    <linearGradient id="roxo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="458" height="208" rx="12" fill="url(#fundo)" stroke="url(#roxo)" stroke-width="2"/>
  <text x="24" y="36" class="titulo">Estatísticas de Gustavo01010001</text>
  
  <g class="linha" style="animation-delay:0.1s">
    <circle cx="30" cy="64" r="4" fill="#c77dff"/>
    <text x="44" y="69" class="label">Contribuições no último ano:</text>
    <text x="270" y="69" class="valor" text-anchor="end">68</text>
  </g>
  <g class="linha" style="animation-delay:0.22s">
    <circle cx="30" cy="88" r="4" fill="#c77dff"/>
    <text x="44" y="93" class="label">Commits no último ano:</text>
    <text x="270" y="93" class="valor" text-anchor="end">60</text>
  </g>
  <g class="linha" style="animation-delay:0.33999999999999997s">
    <circle cx="30" cy="112" r="4" fill="#c77dff"/>
    <text x="44" y="117" class="label">Repositórios públicos:</text>
    <text x="270" y="117" class="valor" text-anchor="end">21</text>
  </g>
  <g class="linha" style="animation-delay:0.45999999999999996s">
    <circle cx="30" cy="136" r="4" fill="#c77dff"/>
    <text x="44" y="141" class="label">Pull requests:</text>
    <text x="270" y="141" class="valor" text-anchor="end">2</text>
  </g>
  <g class="linha" style="animation-delay:0.58s">
    <circle cx="30" cy="160" r="4" fill="#c77dff"/>
    <text x="44" y="165" class="label">Linguagens usadas:</text>
    <text x="270" y="165" class="valor" text-anchor="end">9</text>
  </g>
  <g class="linha" style="animation-delay:0.7s">
    <circle cx="30" cy="184" r="4" fill="#c77dff"/>
    <text x="44" y="189" class="label">Seguidores:</text>
    <text x="270" y="189" class="valor" text-anchor="end">1</text>
  </g>
  <g transform="translate(370 118)">
    <circle r="40" fill="none" stroke="#2a1145" stroke-width="7"/>
    <circle r="40" fill="none" stroke="url(#roxo)" stroke-width="7" stroke-linecap="round" class="anel" transform="rotate(-90)"/>
    <text y="6" class="grande" text-anchor="middle">68</text>
    <text y="62" class="peq" text-anchor="middle">contribuições</text>
  </g>
</svg>